- id: valid-parentheses
  title: Valid Parentheses
  pattern: stack
  difficulty: easy
  leetcode: https://leetcode.com/problems/valid-parentheses/
  fn: is_valid
  statement: |
    `s` contains only `()[]{}`. It is valid if every bracket is closed by the same type, in the correct order.

    ```
    "()[]{}" -> True     "(]" -> False     "([)]" -> False
    ```
  starter: |
    def is_valid(s):
        pass
  tests:
    - {args: ["()"], expected: true}
    - {args: ["()[]{}"], expected: true}
    - {args: ["(]"], expected: false}
    - {args: ["([)]"], expected: false, hidden: true}
    - {args: ["{[]}"], expected: true, hidden: true}
    - {args: ["["], expected: false, hidden: true}
    - {args: ["]"], expected: false, hidden: true}
  hints:
    - Push openers. On a closer, the top of the stack must be its partner.
  solution: |
    def is_valid(s):
        pair = {")": "(", "]": "[", "}": "{"}
        st = []
        for ch in s:
            if ch in pair:
                if not st or st.pop() != pair[ch]:
                    return False
            else:
                st.append(ch)
        return not st
  complexity: O(n) time, O(n) space
  explain: Don't forget the leftover check (`not st`) for unclosed openers.

- id: min-stack
  title: Min Stack
  pattern: stack
  difficulty: medium
  kind: design
  className: MinStack
  leetcode: https://leetcode.com/problems/min-stack/
  statement: |
    Design a stack supporting `push(val)`, `pop()`, `top()` and `get_min()`, **all in O(1)**.

    ```
    s = MinStack(); s.push(-2); s.push(0); s.push(-3)
    s.get_min() -> -3;  s.pop();  s.top() -> 0;  s.get_min() -> -2
    ```
  starter: |
    class MinStack:
        def __init__(self):
            pass

        def push(self, val):
            pass

        def pop(self):
            pass

        def top(self):
            pass

        def get_min(self):
            pass
  tests:
    - ops: [MinStack, push, push, push, get_min, pop, top, get_min]
      args: [[], [-2], [0], [-3], [], [], [], []]
      expected: [null, null, null, null, -3, null, 0, -2]
    - ops: [MinStack, push, push, get_min, pop, get_min]
      args: [[], [5], [5], [], [], []]
      expected: [null, null, null, 5, null, 5]
    - ops: [MinStack, push, top, get_min]
      args: [[], [7], [], []]
      expected: [null, null, 7, 7]
      hidden: true
    - ops: [MinStack, push, push, push, pop, get_min, pop, get_min]
      args: [[], [3], [1], [2], [], [], [], []]
      expected: [null, null, null, null, null, 1, null, 3]
      hidden: true
  hints:
    - Store, with each element, the minimum of the stack up to and including it.
  solution: |
    class MinStack:
        def __init__(self):
            self.st = []

        def push(self, val):
            m = val if not self.st else min(val, self.st[-1][1])
            self.st.append((val, m))

        def pop(self):
            self.st.pop()

        def top(self):
            return self.st[-1][0]

        def get_min(self):
            return self.st[-1][1]
  complexity: O(1) per operation, O(n) space
  explain: This "augmented stack" idea shows up again for max-stacks and frequency stacks.

- id: daily-temperatures
  title: Daily Temperatures
  pattern: stack
  difficulty: medium
  leetcode: https://leetcode.com/problems/daily-temperatures/
  fn: daily_temperatures
  statement: |
    For each day, return how many days you must wait for a warmer temperature (`0` if never).

    ```
    [73,74,75,71,69,72,76,73] -> [1,1,4,2,1,1,0,0]
    ```
  starter: |
    def daily_temperatures(temperatures):
        pass
  tests:
    - {args: [[73, 74, 75, 71, 69, 72, 76, 73]], expected: [1, 1, 4, 2, 1, 1, 0, 0]}
    - {args: [[30, 40, 50, 60]], expected: [1, 1, 1, 0]}
    - {args: [[30, 60, 90]], expected: [1, 1, 0]}
    - {args: [[90, 80, 70]], expected: [0, 0, 0], hidden: true}
    - {args: [[50]], expected: [0], hidden: true}
  hints:
    - Keep a stack of days still waiting for a warmer day. A new reading resolves all colder ones on top.
  solution: |
    def daily_temperatures(temperatures):
        res = [0] * len(temperatures)
        st = []
        for i, t in enumerate(temperatures):
            while st and temperatures[st[-1]] < t:
                j = st.pop()
                res[j] = i - j
            st.append(i)
        return res
  complexity: O(n) time, O(n) space
  explain: Textbook monotonic (decreasing) stack.

- id: eval-rpn
  title: Evaluate Reverse Polish Notation
  pattern: stack
  difficulty: medium
  leetcode: https://leetcode.com/problems/evaluate-reverse-polish-notation/
  fn: eval_rpn
  statement: |
    Evaluate an arithmetic expression given as a list of tokens in Reverse Polish Notation. Operators are `+ - * /`. Division **truncates toward zero**. All intermediate results fit in 32 bits.

    ```
    ["2","1","+","3","*"] -> 9
    ["4","13","5","/","+"] -> 6
    ```
  starter: |
    def eval_rpn(tokens):
        pass
  tests:
    - {args: [["2", "1", "+", "3", "*"]], expected: 9}
    - {args: [["4", "13", "5", "/", "+"]], expected: 6}
    - {args: [["10", "6", "9", "3", "+", "-11", "*", "/", "*", "17", "+", "5", "+"]], expected: 22}
    - {args: [["3", "-4", "/"]], expected: 0, hidden: true}
    - {args: [["-7", "2", "/"]], expected: -3, hidden: true}
  hints:
    - Numbers go on the stack; an operator pops two and pushes the result. Mind the order of operands.
    - "Python's // floors. Use int(a / b) to truncate toward zero."
  solution: |
    def eval_rpn(tokens):
        st = []
        for t in tokens:
            if t in "+-*/" and len(t) == 1:
                b, a = st.pop(), st.pop()
                if t == "+": st.append(a + b)
                elif t == "-": st.append(a - b)
                elif t == "*": st.append(a * b)
                else: st.append(int(a / b))
            else:
                st.append(int(t))
        return st[0]
  complexity: O(n) time, O(n) space
  explain: This is the classic place where Java developers expect truncation and Python floors. Check `-7 // 2`.

- id: largest-rectangle-histogram
  title: Largest Rectangle in Histogram
  pattern: stack
  difficulty: hard
  leetcode: https://leetcode.com/problems/largest-rectangle-in-histogram/
  fn: largest_rectangle_area
  statement: |
    `heights[i]` is the height of the i-th bar (width 1) in a histogram. Return the area of the largest rectangle.

    ```
    [2,1,5,6,2,3] -> 10
    [2,4] -> 4
    ```
  starter: |
    def largest_rectangle_area(heights):
        pass
  tests:
    - {args: [[2, 1, 5, 6, 2, 3]], expected: 10}
    - {args: [[2, 4]], expected: 4}
    - {args: [[1]], expected: 1, hidden: true}
    - {args: [[2, 2, 2, 2]], expected: 8, hidden: true}
    - {args: [[6, 2, 5, 4, 5, 1, 6]], expected: 12, hidden: true}
  hints:
    - For each bar, how far can it extend left and right while staying the minimum?
    - Keep an increasing stack; when a shorter bar arrives, popped bars have found their right boundary.
  solution: |
    def largest_rectangle_area(heights):
        st = []                    # (start_index, height), increasing heights
        best = 0
        for i, h in enumerate(heights):
            start = i
            while st and st[-1][1] > h:
                idx, height = st.pop()
                best = max(best, height * (i - idx))
                start = idx
            st.append((start, h))
        for idx, height in st:
            best = max(best, height * (len(heights) - idx))
        return best
  complexity: O(n) time, O(n) space
  explain: Storing the *start* index lets a new bar inherit the leftmost position of everything it popped.
