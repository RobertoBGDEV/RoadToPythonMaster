- id: valid-palindrome
  title: Valid Palindrome
  pattern: two-pointers
  difficulty: easy
  leetcode: https://leetcode.com/problems/valid-palindrome/
  fn: is_palindrome
  statement: |
    A phrase is a palindrome if, after lowercasing and removing every non-alphanumeric character, it reads the same forwards and backwards. Return whether `s` is a palindrome.

    ```
    "A man, a plan, a canal: Panama" -> True
    "race a car" -> False
    ```
  starter: |
    def is_palindrome(s):
        pass
  tests:
    - {args: ["A man, a plan, a canal: Panama"], expected: true}
    - {args: ["race a car"], expected: false}
    - {args: [" "], expected: true}
    - {args: ["0P"], expected: false, hidden: true}
    - {args: ["ab_a"], expected: true, hidden: true}
  hints:
    - Move two pointers inward, skipping characters that aren't alphanumeric.
  solution: |
    def is_palindrome(s):
        l, r = 0, len(s) - 1
        while l < r:
            while l < r and not s[l].isalnum():
                l += 1
            while l < r and not s[r].isalnum():
                r -= 1
            if s[l].lower() != s[r].lower():
                return False
            l += 1
            r -= 1
        return True
  complexity: O(n) time, O(1) space
  explain: The pythonic version `t = [c.lower() for c in s if c.isalnum()]; return t == t[::-1]` is O(n) space. Mention both.

- id: two-sum-sorted
  title: Two Sum II (sorted input)
  pattern: two-pointers
  difficulty: easy
  leetcode: https://leetcode.com/problems/two-sum-ii-input-array-is-sorted/
  fn: two_sum_sorted
  statement: |
    `numbers` is sorted in non-decreasing order. Return the **1-indexed** positions `[i, j]` (`i < j`) of the two numbers adding to `target`. Exactly one solution exists. Use only O(1) extra space.

    ```
    numbers = [2,7,11,15], target = 9 -> [1, 2]
    ```
  starter: |
    def two_sum_sorted(numbers, target):
        pass
  tests:
    - {args: [[2, 7, 11, 15], 9], expected: [1, 2]}
    - {args: [[2, 3, 4], 6], expected: [1, 3]}
    - {args: [[-1, 0], -1], expected: [1, 2]}
    - {args: [[1, 2, 3, 4, 4, 9, 56, 90], 8], expected: [4, 5], hidden: true}
  hints:
    - Sorted input means the sum is controllable. Too big? Move which pointer?
  solution: |
    def two_sum_sorted(numbers, target):
        l, r = 0, len(numbers) - 1
        while l < r:
            s = numbers[l] + numbers[r]
            if s == target:
                return [l + 1, r + 1]
            if s < target:
                l += 1
            else:
                r -= 1
  complexity: O(n) time, O(1) space
  explain: This is the base step of 3Sum.

- id: three-sum
  title: 3Sum
  pattern: two-pointers
  difficulty: medium
  leetcode: https://leetcode.com/problems/3sum/
  fn: three_sum
  compare: unordered_nested
  statement: |
    Return all **unique** triplets `[a, b, c]` from `nums` with `a + b + c == 0`. The solution set must not contain duplicate triplets. Order doesn't matter.

    ```
    [-1,0,1,2,-1,-4] -> [[-1,-1,2],[-1,0,1]]
    ```
  starter: |
    def three_sum(nums):
        pass
  tests:
    - {args: [[-1, 0, 1, 2, -1, -4]], expected: [[-1, -1, 2], [-1, 0, 1]]}
    - {args: [[0, 1, 1]], expected: []}
    - {args: [[0, 0, 0]], expected: [[0, 0, 0]]}
    - {args: [[0, 0, 0, 0]], expected: [[0, 0, 0]], hidden: true}
    - {args: [[-2, 0, 1, 1, 2]], expected: [[-2, 0, 2], [-2, 1, 1]], hidden: true}
    - {args: [[3, -2, 1, 0]], expected: [], hidden: true}
  hints:
    - Sort first. Fix the first number, then run two-sum-sorted on the rest.
    - Skip duplicate values for the fixed number and for the pointers after a hit.
  solution: |
    def three_sum(nums):
        nums.sort()
        res = []
        for i, a in enumerate(nums):
            if i > 0 and a == nums[i - 1]:
                continue
            l, r = i + 1, len(nums) - 1
            while l < r:
                s = a + nums[l] + nums[r]
                if s < 0:
                    l += 1
                elif s > 0:
                    r -= 1
                else:
                    res.append([a, nums[l], nums[r]])
                    l += 1
                    while l < r and nums[l] == nums[l - 1]:
                        l += 1
        return res
  complexity: O(n²) time, O(1) extra space (excluding output / sort)
  explain: Dedup via sorting + skipping equal neighbours beats using a set of tuples.

- id: container-most-water
  title: Container With Most Water
  pattern: two-pointers
  difficulty: medium
  leetcode: https://leetcode.com/problems/container-with-most-water/
  fn: max_area
  statement: |
    `height[i]` is the height of a vertical line at x = i. Pick two lines that, with the x-axis, hold the most water. Return that maximum area.

    ```
    [1,8,6,2,5,4,8,3,7] -> 49
    ```
  starter: |
    def max_area(height):
        pass
  tests:
    - {args: [[1, 8, 6, 2, 5, 4, 8, 3, 7]], expected: 49}
    - {args: [[1, 1]], expected: 1}
    - {args: [[4, 3, 2, 1, 4]], expected: 16, hidden: true}
    - {args: [[1, 2, 1]], expected: 2, hidden: true}
  hints:
    - Start with the widest container. Which line should you drop to have any chance of improving?
  solution: |
    def max_area(height):
        l, r = 0, len(height) - 1
        best = 0
        while l < r:
            best = max(best, (r - l) * min(height[l], height[r]))
            if height[l] < height[r]:
                l += 1
            else:
                r -= 1
        return best
  complexity: O(n) time, O(1) space
  explain: Area is limited by the shorter wall. Moving the taller wall can only reduce width without raising the limit, so move the shorter one.

- id: trapping-rain-water
  title: Trapping Rain Water
  pattern: two-pointers
  difficulty: hard
  leetcode: https://leetcode.com/problems/trapping-rain-water/
  fn: trap
  statement: |
    Given `height`, an elevation map where each bar has width 1, return how much water it can trap after raining.

    ```
    [0,1,0,2,1,0,1,3,2,1,2,1] -> 6
    ```
  starter: |
    def trap(height):
        pass
  tests:
    - {args: [[0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1]], expected: 6}
    - {args: [[4, 2, 0, 3, 2, 5]], expected: 9}
    - {args: [[]], expected: 0, hidden: true}
    - {args: [[3, 3, 3]], expected: 0, hidden: true}
    - {args: [[5, 4, 1, 2]], expected: 1, hidden: true}
  hints:
    - Water above bar i = min(tallest on its left, tallest on its right) - height[i].
    - Instead of precomputing both arrays, keep running maxima from both ends and always advance the smaller side.
  solution: |
    def trap(height):
        if not height:
            return 0
        l, r = 0, len(height) - 1
        lmax, rmax = height[l], height[r]
        total = 0
        while l < r:
            if lmax < rmax:
                l += 1
                lmax = max(lmax, height[l])
                total += lmax - height[l]
            else:
                r -= 1
                rmax = max(rmax, height[r])
                total += rmax - height[r]
        return total
  complexity: O(n) time, O(1) space
  explain: The smaller of the two running maxima is the binding wall for the side we advance, so we never need the other side's exact value.
